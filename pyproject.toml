[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stmut-hires"
version = "0.1.0"
description = "Call CNV of Spatial transcriptomics from high-resolution platform. VisiumHD, etc"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "limin_chen", email = "lynnchen31@gmail.com"},
]
# List your external library requirements here
dependencies = [
    "seaborn>=0.13,<0.14",
    "tqdm>=4.64",
    "pyarrow>=10.0,<16",
    "wquantiles>=0.6",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
stmut-hires = "stmut_hires.main:main"


